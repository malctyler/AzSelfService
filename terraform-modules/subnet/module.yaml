name: "subnet"
version: "1.0.0"
description: "Azure Subnet"
terraform_path: "terraform-modules/subnet"

variables:
  - name: "name"
    type: "string"
    required: true
    description: "Subnet name"

  - name: "resource_group_name"
    type: "string"
    required: true
    description: "Resource group containing the virtual network"

  - name: "virtual_network_name"
    type: "string"
    required: true
    description: "Virtual network name"

  - name: "address_prefixes"
    type: "array"
    required: true
    description: "Subnet CIDR prefixes"

  - name: "service_endpoints"
    type: "array"
    required: false
    default: []
    description: "Subnet service endpoints"

  - name: "default_outbound_access_enabled"
    type: "boolean"
    required: false
    default: true
    description: "Default outbound access"

  - name: "private_endpoint_network_policies"
    type: "string"
    required: false
    default: "Enabled"
    enum: ["Enabled", "Disabled", "NetworkSecurityGroupEnabled", "RouteTableEnabled"]
    description: "Private endpoint network policies setting"

  - name: "private_link_service_network_policies_enabled"
    type: "boolean"
    required: false
    default: true
    description: "Private link service network policies enabled"

outputs:
  - name: "id"
    description: "ID of the subnet"

  - name: "name"
    description: "Name of the subnet"

ui_schema:
  layout: "vertical"
  sections:
    - title: "Subnet"
      fields:
        - name: "name"
          label: "Subnet Name"
          component: "text-input"
          placeholder: "VDI-1"

        - name: "resource_group_name"
          label: "Resource Group"
          component: "text-input"
          placeholder: "MJT-AZNetwork-NE-01-rg"

        - name: "virtual_network_name"
          label: "Virtual Network Name"
          component: "text-input"
          placeholder: "MJT-01-vn"

        - name: "address_prefixes"
          label: "Address Prefixes"
          component: "text-input"
          placeholder: '["10.156.232.0/23"]'
